<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="terrain-icon-title terrain-icon-desc">
  <title id="terrain-icon-title">TERRAIN — Logo</title>
  <desc id="terrain-icon-desc">Emblème géométrique d’un terrain de football vert forêt avec lignes blanches et rond central vert vif.</desc>
  <defs>
    <style>
      .badge { fill: #123D2B; }
      .frame { fill: none; stroke: #32CD75; stroke-opacity: 0.25; stroke-width: 2; }
      .lines { fill: none; stroke: #F8FAF7; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .center-ring { fill: none; stroke: #32CD75; stroke-width: 7; }
      .center-dot { fill: #32CD75; }
    </style>
  </defs>
  <rect class="badge" x="4" y="4" width="120" height="120" rx="28" />
  <rect class="frame" x="9" y="9" width="110" height="110" rx="23" />
  <g id="pitch-lines">
    <rect class="lines" x="24" y="24" width="80" height="80" rx="14" />
    <path class="lines" d="M46 24 V38 H82 V24" />
    <path class="lines" d="M46 104 V90 H82 V104" />
    <line class="lines" x1="24" y1="64" x2="46" y2="64" />
    <line class="lines" x1="82" y1="64" x2="104" y2="64" />
  </g>
  <g id="kickoff">
    <circle class="center-ring" cx="64" cy="64" r="18" />
    <circle class="center-dot" cx="64" cy="64" r="6.5" />
  </g>
</svg>
